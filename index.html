<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Francés: La Négation</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --accent: #3b82f6;
            --accent-success: #10b981;
            --accent-error: #ef4444;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--bg-card);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 { color: var(--accent); margin-top: 0; font-size: 2.5rem; }
        h2 { color: var(--text); }
        
        .hidden { display: none !important; }

        /* Pantalla de Configuración */
        .setup-group {
            margin: 20px 0;
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 12px;
        }
        label { display: block; margin-bottom: 10px; font-weight: bold; }
        select, input[type="text"] {
            width: 100%;
            max-width: 400px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--text-muted);
            background: var(--bg-main);
            color: var(--text);
            font-size: 1rem;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #2563eb; }
        .btn-success { background: var(--accent-success); }
        .btn-success:hover { background: #059669; }

        /* Grid de Equipos */
        .game-layout {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 30px;
            text-align: left;
        }
        .leaderboard {
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .team-score {
            padding: 10px;
            margin: 10px 0;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
        }
        .active-team-highlight {
            border: 2px solid var(--accent);
            background: rgba(59, 130, 246, 0.1);
        }

        /* Área de Preguntas */
        .turn-info {
            font-size: 1.3rem;
            background: rgba(59, 130, 246, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            border-left: 5px solid var(--accent);
        }
        .question-box {
            font-size: 1.8rem;
            margin: 30px 0;
            font-weight: bold;
            background: rgba(255,255,255,0.02);
            padding: 20px;
            border-radius: 10px;
            border: 1px dashed rgba(255,255,255,0.1);
        }

        /* Opciones */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .option-btn {
            background: rgba(255,255,255,0.05);
            color: var(--text);
            border: 2px solid rgba(255,255,255,0.1);
            padding: 18px;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }
        .option-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--accent); }
        
        /* Feedback */
        .feedback {
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 1.4rem;
            font-weight: bold;
        }
        .correct-box { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid var(--accent-success); }
        .incorrect-box { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid var(--accent-error); }

        /* Podio */
        .podium {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            margin-top: 40px;
            height: 200px;
        }
        .podium-place {
            background: var(--accent);
            width: 120px;
            padding: 20px;
            border-radius: 10px 10px 0 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
        }
        .first { height: 160px; background: #fbbf24; color: #000; }
        .second { height: 120px; background: #cbd5e1; color: #000; }
        .third { height: 90px; background: #b45309; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div id="setup-screen">
        <h1>La Négation en Français 🇫🇷</h1>
        <p>Juego grupal proyectado para jugar por equipos (de 2 a 14 jugadores en total)</p>
        
        <div class="setup-group">
            <label for="team-count">¿Cuántos equipos van a jugar?</label>
            <select id="team-count" onchange="generateTeamInputs()">
                <option value="2">2 Equipos</option>
                <option value="3">3 Equipos</option>
                <option value="4">4 Equipos</option>
            </select>
            
            <div id="teams-names-container" style="margin-top: 20px;">
                </div>
        </div>

        <button class="btn" onclick="startGame()">¡Comenzar Juego!</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="game-layout">
            <div>
                <div class="turn-info" id="turn-display">
                    Cargando turno...
                </div>
                
                <div class="question-box" id="question-text">
                    Aquí va la pregunta
                </div>

                <div id="multiple-choice-container" class="options-grid">
                    </div>

                <div id="text-input-container" class="hidden" style="margin-bottom: 20px;">
                    <input type="text" id="blank-input" placeholder="Escribe la negación correspondiente aquí...">
                    <br>
                    <button class="btn btn-success" onclick="verifyTextInput()">Verificar Respuesta</button>
                </div>

                <div id="feedback-box" class="feedback hidden"></div>
                
                <button id="next-btn" class="btn hidden" onclick="nextTurn()" style="margin-top: 20px;">Siguiente Turno</button>
            </div>

            <div class="leaderboard">
                <h3>Puntuación</h3>
                <div id="scores-list"></div>
            </div>
        </div>
    </div>

    <div id="end-screen" class="hidden">
        <h1>¡Fin de la Partida! 🏆</h1>
        <h2>Resultados finales:</h2>
        <div class="podium" id="podium-container">
            </div>
        <br><br>
        <button class="btn" onclick="location.reload()">Jugar de Nuevo</button>
    </div>
</div>

<script>
    // Banco de preguntas equilibrado (26 preguntas)
    const questions = [
        { type: "multiple", q: "Completa la negación básica: 'Je ___ parle ___ français' (Yo no hablo francés)", options: ["ne / pas", "pas / ne", "ne / rien"], correct: 0 },
        { type: "input", q: "Completa la frase: 'Il ____ mange ____' (Él no come nada)", correct: "ne rien" },
        { type: "multiple", q: "¿Cómo se dice 'Yo nunca como manzanas'?", options: ["Je ne mange pas de pommes", "Je ne mange jamais de pommes", "Je plus mange pas de pommes"], correct: 1 },
        { type: "input", q: "Completa: 'Elle ____ étudie ____' (Ella ya no estudia)", correct: "ne plus" },
        { type: "multiple", q: "Traduce correctamente: 'No entiendo nada'", options: ["Je ne comprends plus", "Je ne comprends pas", "Je ne comprends rien"], correct: 2 },
        { type: "input", q: "Escribe la negación que falta para: 'Nous ____ voyageons ____' (Nosotros nunca viajamos)", correct: "ne jamais" },
        { type: "multiple", q: "Si la palabra que sigue empieza por vocal: 'Je ___ aime ___ le chocolat'", options: ["ne / pas", "n' / pas", "n' / rien"], correct: 1 },
        { type: "input", q: "Completa usando apostrofe: 'Il ____ achète ____' (Él ya no compra)", correct: "n' plus" },
        { type: "multiple", q: "¿Cuál frase significa 'Él ya no trabaja aquí'?", options: ["Il ne travaille plus ici", "Il ne travaille jamais ici", "Il ne travaille pas ici"], correct: 0 },
        { type: "input", q: "Completa: 'Tu ____ as ____ fait' (Tú no has hecho nada)", correct: "n' rien" },
        { type: "multiple", q: "Traduce: 'Yo no quiero té'", options: ["Je ne veux pas de thé", "Je ne veux rien de thé", "Je ne veux plus de thé"], correct: 0 },
        { type: "multiple", q: "¿Qué significa 'Je ne sais jamais'?", options: ["Yo no sé nada", "Yo ya no sé", "Yo nunca sé"], correct: 2 },
        { type: "input", q: "Completa la frase: 'Vous ____ lisez ____' (Ustedes no leen)", correct: "ne pas" },
        { type: "multiple", q: "Elige la correcta: 'Ella no ve a nadie' (Nadie = personne)", options: ["Elle ne voit personne", "Elle ne personne voit", "Elle pas voit personne"], correct: 0 },
        { type: "input", q: "Completa: 'Je ____ bois ____ de café' (Ya no tomo café)", correct: "ne plus" },
        { type: "multiple", q: "Traduce: 'No tengo ningún amigo'", options: ["Je n'ai pas d'amis", "Je n'ai aucun ami", "Je ne veux plus d'amis"], correct: 1 },
        { type: "input", q: "Completa la frase: 'On ____ sait ____' (Uno nunca sabe)", correct: "ne jamais" },
        { type: "multiple", q: "¿Cuál es la estructura correcta de la negación en francés?", options: ["Sujeto + pas + verbo + ne", "Sujeto + ne + verbo + pas", "Sujeto + verbo + ne + pas"], correct: 1 },
        { type: "input", q: "Completa con vocal: 'Je ____écoute ____' (Yo no escucho)", correct: "n' pas" },
        { type: "multiple", q: "Traduce: 'No hay nada'", options: ["Il n'y a plus", "Il n'y a pas", "Il n'y a rien"], correct: 2 },
        { type: "input", q: "Completa: 'Marie ____ court ____' (Marie ya no corre)", correct: "ne plus" },
        { type: "multiple", q: "Traduce: 'No me gusta nada el fútbol'", options: ["Je n'aime pas du tout le football", "Je n'aime rien le football", "Je ne plus aime le football"], correct: 0 },
        { type: "input", q: "Completa: 'Ils ____ dorment ____' (Ellos no duermen)", correct: "ne pas" },
        { type: "multiple", q: "¿Qué significa 'Je ne voyage plus'?", options: ["Nunca viajo", "Ya no viajo", "No viajo"], correct: 1 },
        { type: "input", q: "Completa con vocal: 'Nous ____ habitons ____ ici' (Ya no vivimos aquí)", correct: "n' habitons plus" }
    ];

    let gameTeams = [];
    let currentQuestionIndex = 0;
    let currentTeamTurn = 0;
    let totalRondas = 3;
    let currentRonda = 1;

    // Generar campos de nombres de equipos en la pantalla inicial
    function generateTeamInputs() {
        const count = parseInt(document.getElementById('team-count').value);
        const container = document.getElementById('teams-names-container');
        container.innerHTML = '';
        
        for(let i = 1; i <= count; i++) {
            container.innerHTML += `
                <div>
                    <label>Nombre del Equipo ${i}:</label>
                    <input type="text" id="team-name-${i}" value="Équipe ${i}">
                </div>
            `;
        }
    }

    // Inicializar configuración al cargar
    generateTeamInputs();

    // Arrancar la lógica del juego
    function startGame() {
        const count = parseInt(document.getElementById('team-count').value);
        gameTeams = [];

        for(let i = 1; i <= count; i++) {
            let name = document.getElementById(`team-name-${i}`).value.trim();
            gameTeams.push({ name: name, score: 0 });
        }

        // Mezclar las preguntas para que varíen en cada juego
        questions.sort(() => Math.random() - 0.5);

        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        
        updateLeaderboard();
        loadQuestion();
    }

    // Actualizar el panel lateral
    function updateLeaderboard() {
        const list = document.getElementById('scores-list');
        list.innerHTML = '';
        gameTeams.forEach((team, index) => {
            let activeClass = (index === currentTeamTurn) ? 'active-team-highlight' : '';
            list.innerHTML += `
                <div class="team-score ${activeClass}">
                    <span>${team.name}</span>
                    <strong>${team.score} pts</strong>
                </div>
            `;
        });
    }

    // Cargar la pregunta del turno actual
    function loadQuestion() {
        document.getElementById('feedback-box').classList.add('hidden');
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('blank-input').value = '';

        if (currentQuestionIndex >= questions.length) {
            currentQuestionIndex = 0; // Reiniciar banco si se acaban
        }

        const currentQuestion = questions[currentQuestionIndex];
        const currentTeam = gameTeams[currentTeamTurn];

        document.getElementById('turn-display').innerHTML = ` Rda ${currentRonda}/${totalRondas} | Turno de: <strong>${currentTeam.name}</strong>`;
        document.getElementById('question-text').innerText = currentQuestion.q;

        if(currentQuestion.type === "multiple") {
            document.getElementById('multiple-choice-container').classList.remove('hidden');
            document.getElementById('text-input-container').classList.add('hidden');
            
            const optionsDiv = document.getElementById('multiple-choice-container');
            optionsDiv.innerHTML = '';
            currentQuestion.options.forEach((opt, idx) => {
                optionsDiv.innerHTML += `
                    <button class="option-btn" onclick="verifyMultipleChoice(${idx})"> ${opt}</button>
                `;
            });
        } else {
            document.getElementById('multiple-choice-container').classList.add('hidden');
            document.getElementById('text-input-container').classList.remove('hidden');
        }
        updateLeaderboard();
    }

    // Verificar tipo selección simple
    function verifyMultipleChoice(selectedIndex) {
        const currentQuestion = questions[currentQuestionIndex];
        const feedback = document.getElementById('feedback-box');
        
        // Bloquear botones para evitar doble clic
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => b.disabled = true);

        if(selectedIndex === currentQuestion.correct) {
            feedback.innerText = "¡CORRECTO! +10 puntos";
            feedback.className = "feedback correct-box";
            gameTeams[currentTeamTurn].score += 10;
        } else {
            feedback.innerText = `INCORRECTO. La respuesta correcta era: ${currentQuestion.options[currentQuestion.correct]}`;
            feedback.className = "feedback incorrect-box";
        }
        
        feedback.classList.remove('hidden');
        document.getElementById('next-btn').classList.remove('hidden');
    }

    // Verificar tipo completar escrito
    function verifyTextInput() {
        const currentQuestion = questions[currentQuestionIndex];
        const feedback = document.getElementById('feedback-box');
        let userAns = document.getElementById('blank-input').value.trim().toLowerCase();
        
        // Limpieza básica de espacios extra
        userAns = userAns.replace(/\s+/g, ' '); 
        let cleanCorrect = currentQuestion.correct.toLowerCase().replace(/\s+/g, ' ');

        if(userAns === cleanCorrect || userAns === cleanCorrect.replace('...', ' ')) {
            feedback.innerText = "¡CORRECTO! +10 puntos";
            feedback.className = "feedback correct-box";
            gameTeams[currentTeamTurn].score += 10;
        } else {
            feedback.innerText = `INCORRECTO. La respuesta esperada era: ${currentQuestion.correct}`;
            feedback.className = "feedback incorrect-box";
        }

        feedback.classList.remove('hidden');
        document.getElementById('next-btn').classList.remove('hidden');
    }

    // Controlar el flujo de los turnos y las rondas
    function nextTurn() {
        currentQuestionIndex++;
        currentTeamTurn++;

        // Si ya todos los equipos pasaron, termina la ronda
        if(currentTeamTurn >= gameTeams.length) {
            currentTeamTurn = 0;
            currentRonda++;
        }

        // Si se completan las 3 rondas, ir al podio final
        if(currentRonda > totalRondas) {
            endGame();
        } else {
            loadQuestion();
        }
    }

    // Pantalla de ganadores
    function endGame() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');

        // Ordenar equipos por puntaje para el podio
        let sortedTeams = [...gameTeams].sort((a,b) => b.score - a.score);
        const podium = document.getElementById('podium-container');
        podium.innerHTML = '';

        // Renderizar según los que jueguen
        if(sortedTeams[1]) { // Segundo lugar
            podium.innerHTML += `<div class="podium-place second">🥈 <strong>${sortedTeams[1].name}</strong><span>${sortedTeams[1].score} pts</span></div>`;
        }
        
        // Primer lugar
        podium.innerHTML += `<div class="podium-place first">🥇 <strong>${sortedTeams[0].name}</strong><span>${sortedTeams[0].score} pts</span></div>`;
        
        if(sortedTeams[2]) { // Tercer lugar
            podium.innerHTML += `<div class="podium-place third">🥉 <strong>${sortedTeams[2].name}</strong><span>${sortedTeams[2].score} pts</span></div>`;
        }
    }
</script>

</body>
</html>
